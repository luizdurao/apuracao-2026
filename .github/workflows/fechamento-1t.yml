name: Fechamento por UF no 1º turno

on:
  workflow_dispatch:
    inputs:
      ufs:
        description: 'UFs (separadas por espaço); vazio = todas'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Calcular a partir do boletim de urna do TSE
        env:
          UFS_OVERRIDE: ${{ github.event.inputs.ufs }}
        run: bash scripts/fechamento-1t.sh
      - name: Commit
        run: |
          git config user.name "coletor-tse"
          git config user.email "coletor-tse@users.noreply.github.com"
          git add data/fechamento-1t.json data/fechamento-1t.log
          git diff --cached --quiet && echo "sem mudanças" || (git commit -m "fechamento por UF no 1º turno (bweb TSE)" && git pull --rebase && git push)
