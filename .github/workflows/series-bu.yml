name: Séries de apuração a partir do boletim de urna

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  serie:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - rotulo: "2022"
            saida: data/serie-2022.json
            a: "22:Bolsonaro"
            b: "13:Lula"
            base: https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes2022/buweb/bweb_2t
            stamp: "311020221535"
          - rotulo: "1t"
            saida: data/serie-1t.json
            a: "22:Flávio Bolsonaro"
            b: "13:Lula"
            base: https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes2026/buweb/bweb_1t
            stamp: "051020261403"
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir série ${{ matrix.rotulo }}
        run: python3 scripts/serie_bu.py "${{ matrix.saida }}" "${{ matrix.rotulo }}" "${{ matrix.a }}" "${{ matrix.b }}" "${{ matrix.base }}" "${{ matrix.stamp }}"
      - name: Commit
        run: |
          git config user.name "coletor-tse"
          git config user.email "coletor-tse@users.noreply.github.com"
          git add "${{ matrix.saida }}"
          git diff --cached --quiet && echo "sem mudanças" || (git commit -m "série ${{ matrix.rotulo }} (bweb TSE)" && for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 15; done)
